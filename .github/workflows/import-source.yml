name: Import SlateSSH source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[import-slatessh-source]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .slatessh-upload/part0 .slatessh-upload/part1 > /tmp/slatessh-source.tar.xz
          mkdir -p /tmp/slatessh-extract
          xz -dc /tmp/slatessh-source.tar.xz | tar -x -C /tmp/slatessh-extract
          root="$(find /tmp/slatessh-extract -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$root"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$root"/. .
          chmod +x gradlew tools/verify-policies.sh || true
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import SlateSSH 1.9.0 source"
          git push origin HEAD:main
